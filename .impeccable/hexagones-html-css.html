<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marbre et LED — construction HTML CSS</title><style>
@font-face{font-family:Cormorant;src:url('../assets/fonts/cormorant-garamond.woff2');font-display:swap}*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;color:#f3ece2;background:#0a090a;font-family:Cormorant,Georgia,serif}main{max-width:1300px;margin:auto;padding:36px 25px 65px}header{text-align:center;margin-bottom:25px}h1{font-weight:400;font-size:48px;margin:0 0 7px}header p{font-size:20px;color:#cbbbA7;margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}.option h2{font-size:25px;font-weight:400;margin:15px 0 0}.scene{--led:#ffcd80;--glow:#ffaf40;position:relative;height:285px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 50% 65%,#29201855,transparent 68%)}.stone{position:absolute;width:210px;height:230px;left:50%;top:24px;transform:translateX(-50%);filter:drop-shadow(0 12px 9px #000c)}.hex{position:absolute;inset:0;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:linear-gradient(135deg,#efdfc7,#6d6152 24%,#2c2824 50%,#8e7d65 76%,#e1c69c)}.hex::before{content:'';position:absolute;inset:3px;clip-path:inherit;background:linear-gradient(145deg,#ffffff60,#0000 24%,#0006 80%),repeating-linear-gradient(128deg,transparent 0 27px,#fff2 28px,transparent 30px 65px),linear-gradient(110deg,#222126,#514a44 35%,#17171b 73%);box-shadow:inset 0 12px 15px #fff3}.hex::after{content:'';position:absolute;inset:13px;clip-path:inherit;background:linear-gradient(145deg,#ffffff25,#0006),repeating-linear-gradient(125deg,transparent 0 34px,#f8f4ed44 35px,transparent 37px 78px),linear-gradient(125deg,#333137,#101014 60%,#2b2729)}.left{width:173px;height:189px;left:30%;top:45px;z-index:-2}.right{width:178px;height:195px;left:70%;top:43px;z-index:-2}.farleft{width:91px;height:100px;left:14%;top:90px;z-index:-3}.farright{width:94px;height:103px;left:86%;top:90px;z-index:-3}.rear{filter:drop-shadow(0 0 3px var(--led)) drop-shadow(0 0 10px var(--glow)) drop-shadow(0 10px 10px #000)}.rear .hex{background:var(--led)}.rear .hex::before{inset:2px}.rear .hex::after{inset:10px}.front{z-index:2;width:220px;height:241px;top:17px}.front .hex{background:linear-gradient(135deg,#eee7da,#746a60 34%,#e4d6c0 58%,#5b5147 85%,#d5b68a)}.front .hex::before{background:linear-gradient(145deg,#ffffff66,#0000 22%,#0005 90%),repeating-linear-gradient(125deg,transparent 0 28px,#18141744 29px,transparent 32px 74px),linear-gradient(130deg,#aaa196,#e3dbcc 50%,#8b8178)}.front .hex::after{inset:17px;background:linear-gradient(145deg,#fff4,#0002),repeating-linear-gradient(125deg,transparent 0 29px,#322c2d55 31px,transparent 33px 75px),linear-gradient(130deg,#b6ada0,#dcd4c6 53%,#999084)}.mark{position:absolute;inset:46px 39px;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#34281d;text-align:center;text-shadow:0 1px #f3e2c6a6;font-size:18px;letter-spacing:.06em}.mark strong{font-size:66px;font-weight:500;line-height:1;letter-spacing:-.05em}.mark span{margin-top:10px;font-size:12px;letter-spacing:.2em}.glow{position:absolute;left:15%;right:15%;height:17px;top:207px;background:var(--glow);filter:blur(20px);opacity:.4;z-index:-1}.pulse .rear,.pulse .glow{animation:breathe 4s ease-in-out infinite}.white{--led:#fff5e7;--glow:#f4dfbd}.red{--led:#f45d63;--glow:#cc142d}.red .front .hex::before,.red .front .hex::after{background:linear-gradient(145deg,#fff2,#0007),repeating-linear-gradient(125deg,transparent 0 29px,#e0d6cd44 31px,transparent 33px 75px),linear-gradient(130deg,#3d3839,#121114 65%,#292527)}.red .mark{color:#d8bf9b;text-shadow:0 2px #000}.sequence .left{animation:ignite 6s ease-in-out infinite}.sequence .right{animation:ignite 6s .6s ease-in-out infinite}.sequence .farleft{animation:ignite 6s 1.2s ease-in-out infinite}.sequence .farright{animation:ignite 6s 1.8s ease-in-out infinite}.option p{font-size:18px;color:#cbbba6;margin:0 0 15px}.note{text-align:center;color:#b9aa97;font-size:18px;margin-top:25px}@keyframes breathe{0%,100%{filter:drop-shadow(0 0 1px var(--led)) drop-shadow(0 0 3px var(--glow));opacity:.65}50%{filter:drop-shadow(0 0 4px var(--led)) drop-shadow(0 0 15px var(--glow));opacity:1}}@keyframes ignite{0%,100%{filter:drop-shadow(0 0 1px var(--led));opacity:.5}35%,65%{filter:drop-shadow(0 0 5px var(--led)) drop-shadow(0 0 14px var(--glow));opacity:1}}@media(max-width:800px){.grid{grid-template-columns:1fr}.scene{max-width:580px;margin:auto}h1{font-size:38px}}@media(max-width:430px){main{padding:27px 13px}.scene{height:255px;transform:scale(.88);transform-origin:center center;margin:0 -15px}.stone.front{width:200px;height:219px;top:27px}.left{left:27%}.right{left:73%}.mark strong{font-size:58px}.mark span{font-size:10px}}@media(prefers-reduced-motion:reduce){.scene *{animation:none!important}}
</style></head><body><main><header><h1>Marbre sculpté et lumière indirecte</h1><p>Plaques, biseaux et éclairages construits en HTML et CSS.</p></header><div class="grid" id="variants"></div><p class="note">Le monogramme est du texte modifiable. Aucun visuel de la référence n’est utilisé dans ces compositions.</p></main><script>
const variants=[['A · Doré en respiration','pulse','Une lumière chaude et lente derrière les plaques.'],['B · Blanc chaud fixe','white','Un éclairage stable entre les couches de pierre.'],['C · Allumage en cascade','sequence','Les plaques s’illuminent successivement.'],['D · Bloodline rouge','red pulse','Marbre sombre et lumière rouge indirecte.']];
document.querySelector('#variants').innerHTML=variants.map(([title,style,copy])=>`<section class="option"><h2>${title}</h2><div class="scene ${style}"><div class="glow"></div>${['farleft','farright','left','right'].map(p=>`<div class="stone rear ${p}"><div class="hex"></div></div>`).join('')}<div class="stone front"><div class="hex"></div><div class="mark"><strong>B</strong><span>BLOODLINE<br>TATTOO</span></div></div></div><p>${copy}</p></section>`).join('');
</script></body></html>
